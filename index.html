<style>
:root{color-scheme:dark;--bg:#10171e;--panel:#19232e;--line:#344655;--ink:#f4f7fa;--muted:#bbcbd8;--accent:#83e2bb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}header,main{max-width:1260px;margin:auto;padding:24px}header{display:flex;align-items:end;justify-content:space-between;gap:16px}h1,h2,h3,p{margin:0 0 8px}h1{font-size:clamp(32px,6vw,58px);line-height:1.1}h2{font-size:24px}h3{font-size:17px}small,.muted{color:var(--muted)}.brand{color:var(--accent);letter-spacing:.14em;font-weight:800}.row,.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.actions{margin-top:12px}.panel,.card,dialog{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px}.panel{margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}.lane{min-width:0;padding:10px;background:#131c25;border-radius:12px}.lane .card{margin-bottom:8px}.card p,.detail{white-space:pre-wrap;overflow-wrap:anywhere}.badge{padding:2px 8px;background:#263949;border-radius:20px;font-size:12px}.accent{color:var(--accent)}button,input,select,textarea{font:inherit;color:inherit}button{background:#263949;border:1px solid #466073;padding:6px 10px;border-radius:8px;cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button.primary{background:var(--accent);color:#10251c;border-color:var(--accent);font-weight:700}button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}dialog{color:var(--ink);width:min(660px,94vw);max-height:90vh}dialog::backdrop{background:#000a}label{display:block;margin:10px 0}input,textarea,select{display:block;width:100%;background:#10171e;border:1px solid var(--line);border-radius:8px;padding:8px}textarea{min-height:76px}textarea.packet{min-height:250px;direction:ltr}.error{color:#ffb5ad}.message{min-height:24px;color:var(--accent)}summary{cursor:pointer;color:var(--muted)}code{direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}@media(max-width:560px){header,main{padding:16px}header{align-items:start;flex-direction:column}}
.message:empty{display:none}button,.project-tab{min-height:44px}a{color:var(--accent)}main{padding-top:8px}header h1{font-size:clamp(32px,6vw,48px)}.home-projects{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));margin-top:16px}.project-tile{text-align:start;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:15px;display:block;width:100%;min-width:0}.project-tile strong{display:block;font-size:21px;overflow-wrap:anywhere}.project-tile span{display:block;margin-top:5px;color:var(--muted)}.project-tab{flex:0 0 auto;display:inline-flex;align-items:center;padding:7px 12px;border:1px solid transparent;border-radius:8px;text-decoration:none;color:var(--muted)}.project-tab[aria-current=page]{border-color:var(--line);background:var(--panel);color:var(--accent)}.project-nav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}.quiet{background:transparent}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}.section-title h2{margin:0}.collapsed-task{margin:8px 0;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px}.collapsed-task summary,.management summary{color:var(--ink);overflow-wrap:anywhere}.collapsed-task .card{border:0;padding:12px 0 0;margin:0}.management>summary{font-weight:650}.management[open]>summary{margin-bottom:16px}.chat-messages{display:grid;gap:8px;margin-top:16px}.chat-messages article{padding:12px}.chat-messages article p:last-child{margin-bottom:0}.chat-compose textarea{margin:8px 0}.chat-compose button{margin-top:4px}@media(max-width:560px){header{gap:8px}main{padding-top:4px}.panel{padding:13px}.project-nav{gap:2px}.project-tab{padding-inline:9px}}

<body>
<header><div><div class="brand">AGENT HUB</div><h1 id="viewTitle">פרויקטים</h1><p class="muted" id="viewSubtitle">לוח מנכ״ל</p></div><div class="row"><button id="ceoView" class="quiet" hidden>כל הפרויקטים</button><button class="primary" id="newProduct">פרויקט חדש</button></div></header>
<main><p class="message" role="status" id="status"></p><section id="overview"></section><section id="workspace"></section></main>
<dialog id="modal"><h2 id="dialogTitle"></h2><form id="form"><div id="fields"></div><p id="error" class="error" role="alert"></p><div id="buttons" class="actions"></div></form></dialog>
<script>
"use strict";
const token = "__HUB_TOKEN__";
const roleNames = {product:"מנהל מוצר · Codex",content:"מנהל תוכן · Codex",architect:"ארכיטקט · Codex",designer:"מעצב · Codex",lead:"מנהל פיתוח · Claude",developer:"מפתח · Claude",reviewer:"סוקר קוד מרכזי · Codex",qa:"בודק · Claude"};
const actionNames = {product:"מוצר נוצר",rules:"הגדרות מוצר עודכנו",rule_propose:"הוגשה הצעת כללים",rule_publish:"כללים נכנסו לתוקף",ceo:"יעדי מנכ״ל עודכנו",manager:"מנהל מוצר נוסף",task:"משימה נפתחה",priority:"עדיפות עודכנה",plan:"תוכנית ארכיטקטורה אושרה",start:"משימה שובצה",review:"גרסה הוגשה לסקירה",check:"סקירה נרשמה",done:"מיזוג תועד",release:"מועמד לגרסה נוצר",release_qa:"בדיקת גרסה נרשמה",release_approve:"גרסה אושרה",usage:"שימוש נרשם"};
const ruleAreas = {architecture:["ארכיטקטורה","architect"],design:["מערכת עיצוב","designer"]};
const companyAreas={design:"מנהל עיצוב ראשי",architecture:"ארכיטקט ראשי",product:"מנהל מוצר ראשי"};
let state, selected, projectTab="board", activeChat, polling=false;
const projectTabs={board:"משימות",chats:"שיחות לקוחות",details:"פרטי הפרויקט"};
const chatDrafts=new Map();
Object.assign(actionNames,{chat_open:"שיחת לקוח נפתחה",chat_send:"הודעה נשלחה למנהל המוצר",chat_forward:"דרישה הועברה ללוח",agent_run:"הרצת סוכן הוכנסה לתור",design_spec:"אפיון עיצובי אושר והועבר לארכיטקטורה",content_draft:"טיוטת תוכן הועברה למנהל המוצר",content_publish:"פרסום תוכן תועד"});
Object.assign(actionNames,{takeover_open:"קליטת פרויקט קיים החלה",takeover_brief:"תקציר מוצר אושר לסקירת קוד",takeover_retry:"סקירת קליטה הוכנסה לתור",takeover_approve:"בסיס הפרויקט אושר לניהול"});
Object.assign(actionNames,{company_owner:"מונה מנהל תחום",company_propose:"הוגשה הצעה למסמך החברה",company_review:"סקירת חברה הוכנסה לתור",company_publish:"פורסמה גרסת חברה",company_adopt:"המוצר אימץ גרסת חברה"});
Object.assign(actionNames,{domain_submit:"מסקנה הועברה למנהל התחום",domain_run:"סקירת מסקנה הוכנסה לתור",domain_decide:"המלצת מנהל התחום תועדה"});
Object.assign(actionNames,{ceo_ai_accept:"הצעת המנכ״ל הפכה למשימה",wordflow_import:"פרטי WordFlow מולאו מהמאגר",chat_customer:"שיחת לקוח נפתחה"});
const byId = id => document.getElementById(id);
const make = (tag, text="", cls="") => {
  const node = document.createElement(tag);
  node.textContent = text;
  node.className = cls;
  return node;
};
const btn = (name, click, cls="") => {
  const b = make("button",name,cls);
  b.type="button";
  b.addEventListener("click",click);
  return b;
};
async function api(path, data={}) {
  if (window.AgentHubPages) return window.AgentHubPages.request(path, data);
  const response = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-Hub-Token":token},body:JSON.stringify(data)});
  const payload = await response.json();
  if (!response.ok) throw Error(payload.error);
  return payload;
}
const field = (key,label,type="text",initial="",opts=[]) => ({key,label,type,initial,opts});
const area = (key,label,initial="") => field(key,label,"textarea",initial);
const options = (key,label,opts,initial="") => field(key,label,"select",initial,opts);
const roles = Object.entries(roleNames);
const num = (key,label,initial=0) => field(key,label,"number",initial);
function form(title, fields, onSubmit, controls={}) {
  const modal = byId("modal");
  byId("dialogTitle").textContent = title;
  byId("error").textContent = "";
  byId("fields").replaceChildren();
  if(controls.intro) byId("fields").append(controls.intro);
  for (const f of fields) {
    const label = make("label",f.label);
    const element = make(f.type === "textarea" || f.type === "select" ? f.type : "input");
    if (element.tagName === "INPUT") element.type = f.type;
    if (f.type === "select") for (const [v,name] of f.opts) element.add(new Option(name,v));
    element.name = f.key;
    element.value = f.initial;
    label.append(element);
    byId("fields").append(label);
  }
  const submit = make("button",controls.submit || "שמירה","primary");
  submit.type = "submit";
  byId("buttons").replaceChildren(submit,btn("סגירה",()=>modal.close()));
  if(controls.back) byId("buttons").prepend(btn("חזרה",controls.back));
  byId("form").onsubmit = async event => {
    event.preventDefault();
    if(submit.disabled) return;
    submit.disabled = true;
    const label=submit.textContent;
    if(controls.busy) submit.textContent=controls.busy;
    byId("error").textContent = "";
    try { await onSubmit(Object.fromEntries(new FormData(byId("form")))); }
    catch (error) {
      byId("error").textContent = error.message || "הפעולה נכשלה. נסה שוב.";
      byId("error").scrollIntoView?.({block:"nearest"});
    }
    finally { submit.disabled = false;submit.textContent=label; }
  };
  if (!modal.open) modal.showModal();
}
function edit(action,title,fields,base={}) {
  form(title,fields,async data=>{
    state = await api("/change",{product:selected,...base,...data,action});
    if (action === "product") navigate(state.products.at(-1).id);
    if (action === "chat_open") activeChat=state.products.find(p=>p.id===(base.product || selected)).chats.at(-1).id;
    byId("modal").close();
    byId("status").textContent = actionNames[action];
    render();
  });
}
function productForm(p) {
  const fields = [
    field("repo","מאגר Git", "text",p?.repo),
    field("site_url","כתובת האתר הפעיל","url",p?.site_url),
    field("preview_url","כתובת סביבת תצוגה או בדיקות","url",p?.preview_url),
    area("extra_links","קישורים נוספים · שם | כתובת, שורה לכל קישור",p?.extra_links),
    options("project_status","סטטוס פרויקט",[["planning","בתכנון"],["active","פעיל"],["paused","בהשהיה"],["archived","בארכיון"]],p?.project_status ?? "active"),
    field("checkout","נתיב מקומי מוחלט למאגר (להרצת מפתחים)", "text",p?.checkout),
    area("context","הקשר ויעדי המוצר",p?.context),
    area("customer_voice","קול הלקוחות במוצר · משוב, מקור והחלטות מנכ״ל",p?.customer_voice),
    options("content_mode","ניהול תוכן", [["off","כבוי"],["external","CMS, מסד נתונים או API נפרד"],["repository","תוכן במאגר Git"]],p?.content_mode ?? "off"),
    field("content_path","תיקיית תוכן יחסית במאגר (למסלול Git)","text",p?.content_path),
    area("content_rules","כללי תוכן · סכימה, שדות, ולידציה ודרך הזנה",p?.content_rules),
    ...(!p ? [area("architecture","כללי ארכיטקטורה קיימים (אופציונלי)"),area("design","מערכת עיצוב קיימת (אופציונלי)")] : []),
    num("token_limit","מכסת טוקנים מצטברת (0 = ללא סף)",p?.token_limit),
    num("budget_cents","מכסת הוצאות בסנטים (0 = ללא סף)",p?.budget_cents),
    num("slots","מספר מפתחים במקביל",p?.slots ?? 2),
  ];
  edit(p?"rules":"product",p?"הגדרות מוצר ותקציב":"מוצר חדש",p?fields:[field("name","שם המוצר"),...fields]);
}
const setupNames = {
  deployment:{pages:"GitHub Pages",other:"שירות פריסה אחר",none:"ללא פריסה כרגע"},
  database:{browser:"אחסון בדפדפן",none:"ללא מסד נתונים",d1:"Cloudflare D1",other:"מסד נתונים אחר"}
};
function setupLink(label,url) {
  const a=make("a",label,"badge");
  a.href=url;a.target="_blank";a.rel="noopener noreferrer";
  return a;
}
function githubRepoUrl(value) {
  try {
    const url=new URL(value);
    const parts=url.pathname.match(/^\/([\w.-]+)\/([\w.-]+)(?:\/|$)/);
    if(url.origin==="https://github.com" && parts)
      return url.origin+"/"+parts[1]+"/"+parts[2].replace(/\.git$/,"");
  } catch {}
  return "";
}
function projectSetup(p) {
  const draft={
    name:p?.name || "", context:p?.context || "", repo:p?.repo || "", checkout:p?.checkout || "",
    site_url:p?.site_url || "", preview_url:p?.preview_url || "",
    repository_mode:p?.repo?"existing":"new",base_branch:"main",
    deployment_mode:"pages",deployment_status:"pending",database_mode:"browser",
    database_status:"pending",database_reference:"",...p?.setup
  };
  const statusOptions=[["pending","עדיין לא הושלם"],["ready","הושלם"]];
  const names=["מאגר קוד","קונפיגורציה ופריסה","אחסון הנתונים","סקירה ושמירה"];
  function openExisting() {
    if(p) return false;
    const repo=githubRepoUrl(draft.repo).toLowerCase();
    const name=draft.name.trim().toLowerCase();
    const existing=state.products.find(project=>repo && githubRepoUrl(project.repo).toLowerCase()===repo);
    if(existing){
      byId("modal").close();
      navigate(existing.id);
      byId("status").textContent=existing.name+" כבר בלוח. פתחתי את הכרטיס שלו.";
      return true;
    }
    if(state.products.some(project=>project.name.trim().toLowerCase()===name))
      throw Error("כבר קיים פרויקט בשם הזה. בחר שם אחר או פתח את הפרויקט הקיים מהלוח.");
    return false;
  }
  function show(step) {
    const info=make("div","","card");
    const linkRow=make("div","","actions");
    const repo=githubRepoUrl(draft.repo);
    let fields;
    if(step===0){
      info.append(make("p","למוצר חדש אפשר לפתוח ריפו ייעודי. ב־GitHub בחר בעלים ושם, קבע אם הקוד ציבורי או פרטי וסמן Add a README כדי להתחיל מענף קיים. לפרויקט קיים אפשר להדביק את כתובת הריפו שלו."));
      linkRow.append(setupLink("פתיחת ריפו ב־GitHub","https://github.com/new"),
        setupLink("מדריך פתיחת ריפו","https://docs.github.com/en/repositories/creating-and-managing-repositories/creating-a-new-repository"));
      fields=[...(!p?[field("name","שם הפרויקט","text",draft.name)]:[]),
        options("repository_mode","מאגר קוד",[["new","ריפו חדש"],["existing","ריפו קיים"]],draft.repository_mode),
        field("repo","כתובת הריפו · אפשר להשלים אחר כך","url",draft.repo),
        ...(!window.AgentHubPages?[field("checkout","נתיב checkout מקומי","text",draft.checkout)]:[])];
    } else if(step===1){
      info.append(make("p","אם בחרת GitHub Pages, פתח בריפו Settings → Pages ובחר GitHub Actions כמקור. ודא שיש workflow שבודק ובונה את הפרויקט ומפרסם אותו מענף הבסיס. במסלול GitHub Free, Pages זמין לריפו ציבורי. לשירות אחר בחר בו את הריפו ואת הענף."));
      if(repo) linkRow.append(setupLink("הגדרות Pages",repo+"/settings/pages"),setupLink("GitHub Actions",repo+"/actions"));
      linkRow.append(setupLink("מדריך פריסה ב־Pages","https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site"));
      fields=[field("base_branch","ענף בסיס","text",draft.base_branch),
        options("deployment_mode","שירות פריסה",Object.entries(setupNames.deployment),draft.deployment_mode),
        options("deployment_status","מצב הפריסה",statusOptions,draft.deployment_status),
        field("site_url","כתובת האתר החי","url",draft.site_url),field("preview_url","כתובת סביבת בדיקות","url",draft.preview_url)];
    } else if(step===2){
      info.append(make("p","לאתר סטטי אפשר לבחור ללא מסד נתונים. אם הנתונים דרושים רק במכשיר אחד, אפשר לשמור אותם בדפדפן. Agent Hub ב־GitHub Pages משתמש בכספת מקומית מוצפנת, ולכן לא ביקשנו ממך לפתוח מסד נתונים בענן."),
        make("p","אם משתמשים או מכשירים צריכים לשתף מידע, פתח מסד נתונים לפרויקט. לדוגמה, ב־Cloudflare צור מסד D1, חבר אותו ל־Worker בצד השרת והריץ את סכימת המוצר. שמור בלוח שם או קישור למסך הניהול. את פרטי הגישה הגדר בצד השרת."));
      linkRow.append(setupLink("Cloudflare Dashboard","https://dash.cloudflare.com/"),setupLink("מדריך הקמת D1","https://developers.cloudflare.com/d1/get-started/"));
      fields=[options("database_mode","אחסון הנתונים של הפרויקט",Object.entries(setupNames.database),draft.database_mode),
        options("database_status","מצב הקמת האחסון",statusOptions,draft.database_status),
        field("database_reference","שם מסד הנתונים או קישור לניהול · ללא פרטי גישה","text",draft.database_reference)];
    } else {
      info.append(make("p",[
        "ריפו · "+(draft.repo || "ממתין להשלמה"),"ענף · "+draft.base_branch,
        "פריסה · "+setupNames.deployment[draft.deployment_mode],"נתונים · "+setupNames.database[draft.database_mode]
      ].join("\n"),"detail"),make("p","אפשר לשמור עכשיו ולחזור לאשף מכרטיס הפרויקט להשלמת שלבים."));
      fields=[area("context","יעדי המוצר והקשר",draft.context),
        ...(!p?[area("architecture","כללי ארכיטקטורה קיימים (אופציונלי)",draft.architecture),area("design","כללי עיצוב קיימים (אופציונלי)",draft.design)]:[])];
    }
    if(linkRow.childElementCount) info.append(linkRow);
    form((step+1)+" מתוך "+names.length+" · "+names[step],fields,async data=>{
      Object.assign(draft,data);
      if(step===0 && !draft.name.trim()) throw Error("נדרש שם לפרויקט");
      if(step===0 && openExisting()) return;
      if(step===1 && !draft.base_branch.trim()) throw Error("נדרש ענף בסיס");
      if(step===2 && ["d1","other"].includes(draft.database_mode) && draft.database_status==="ready" && !draft.database_reference.trim())
        throw Error("הזן שם או קישור למסד הנתונים שהוקם");
      if(step<names.length-1){show(step+1);return;}
      if(openExisting()) return;
      state=await api("/change",{
        ...draft,product:p?.id,action:p?"rules":"product",slots:p?.slots ?? 2,
        token_limit:p?.token_limit ?? 0,budget_cents:p?.budget_cents ?? 0,
        project_status:p?.project_status ?? "planning"
      });
      byId("modal").close();
      navigate(p?.id ?? state.products.at(-1).id,p?"details":"board");
      byId("status").textContent=p?"תשתית הפרויקט עודכנה":"הפרויקט נוצר";
      render();
    },{intro:info,submit:step===names.length-1?"שמירת פרויקט":"המשך",busy:step===names.length-1?"שומר פרויקט…":null,back:step?()=>{
      Object.assign(draft,Object.fromEntries(new FormData(byId("form"))));
      show(step-1);
    }:null});
  }
  show(0);
}
function taskArea(p,initial="ui") {
  const choices=[["ui","ממשק"],["backend","תשתית / שרת"]];
  if(p.content_mode && p.content_mode!=="off") choices.push(["content","תוכן"]);
  return options("area","תחום",choices,initial);

  const groups=[
    ["בעבודה",entry=>entry.task.state==="running"],

      if(project.intake_pending) row.append(make("small","קליטת מוצר בתהליך"));
      if(ready({project,task}) && portfolio.active<portfolio.slots){
        const active=project.tasks.filter(t=>t.state==="running").length;

function projectLinks(product) {
  const row=make("div","","actions");
  const links=[["מאגר קוד",product.repo],["אתר חי",product.site_url],["תצוגה מקדימה",product.preview_url]];
  try {
    const repo=new URL(product.repo);
    if(repo.origin==="https://github.com" && /^\/[^/]+\/[^/]+\/?$/.test(repo.pathname)){
      const base=repo.origin+repo.pathname.replace(/\/$/,"").replace(/\.git$/,"");
      links.push(["Actions",base+"/actions"],["Pull requests",base+"/pulls"],["Issues",base+"/issues"]);
    }
  } catch {}
  for(const line of (product.extra_links ?? "").split("\n")){
    const [label,url]=line.split("|").map(part=>part.trim());
    if(label && url) links.push([label,url]);
  }
  for(const [label,url] of links){
    try {
      const target=new URL(url);
      if(!["https:","http:"].includes(target.protocol) || target.username || target.password) continue;
      const link=make("a",label,"badge");
      link.href=target.href;link.target="_blank";link.rel="noopener noreferrer";row.append(link);
    } catch {}
  }
  return row;
}

    if(!profile) throw Error("סקירת WordFlow עדיין אינה זמינה.");
    state=await api("/change",{action:"wordflow_import",profile});
    const imported=state.events.find(event=>event.action==="wordflow_import");
    if(byId("modal").open) byId("modal").close();
    navigate(imported.product,"details");
    byId("status").textContent=actionNames.wordflow_import;
  } catch(error) {

    field("title","מה צריך לעשות?"),area("brief","תיאור קצר")
  ],async data=>{
    state=await api("/change",{action:"task",product:p.id,area:"ui",priority:2,title:data.title,brief:data.brief.trim() || data.title});
    byId("modal").close();
    render();
  },{submit:"פתיחת משימה"}),"primary"));
  section.append(title);
  const tasks=p.tasks.filter(t=>t.area!=="content").sort((a,b)=>a.priority-b.priority);
  const board=make("div","","board");
  const groups=[
    ["לתכנון",["design","draft","ready"]],
    ["בפיתוח",["running"]],
    ["בבדיקה",["review"]],
    ["הושלמו",["done"]]
  ];
  for(const [name,statuses] of groups){
    const items=tasks.filter(t=>statuses.includes(t.state));
    if(statuses[0]==="done" && !items.length) continue;
    const lane=make("div","","lane");
    lane.append(make("h3",name+" · "+items.length));
    for(const item of items) lane.append(compactTask(p,item));
    board.append(lane);
  }
  if(!tasks.length) section.append(make("p","אין עדיין משימות. אפשר לפתוח משימה כאן או להעביר בקשה מתוך שיחת לקוח.","muted"));
  else section.append(board);
  const more=management("עוד אפשרויות",btn("פתיחת פיצ׳ר או באג עם שיוך",()=>addTask(p)));
  if((p.content_mode && p.content_mode!=="off") || p.tasks.some(t=>t.area==="content")) more.append(contentBoard(p));
  return [section,more];
}
function projectReleases(p) {
  const releaseSection=make("section","","panel");
  releaseSection.append(make("h2","גרסאות"),btn("מועמד לגרסה",()=>edit("release","מועמד לגרסה",[field("name","שם הגרסה"),field("items","מזהי משימות שמוזגו"),field("revision","SHA מלא של הגרסה המועמדת")])));
  const releaseGrid=make("div","","grid actions");
  for (const r of p.releases) {
    const card=make("article","","card");
    card.append(make("h3",r.name),make("p",r.approved?"אושרה לפרסום":r.qa?"ממתינה לאישור מנכ״ל":"ממתינה ל־QA","accent"),make("p",r.items.join(", ")),make("code",r.revision));
    if (r.qa) card.append(make("p",r.qa));
    if (!r.approved) {
      const base={release:r.id,revision:r.revision};
      const buttons=make("div","","actions");
      buttons.append(btn("חבילת גרסה",()=>getPacket(p,null,r)),btn("תוצאת QA",()=>edit("release_qa","בדיקת גרסה",[options("result","תוצאה",[["pass","עבר"],["fail","נכשל"]],"pass"),area("evidence","ראיות או צעדי שחזור")],base)));
      if (r.qa) buttons.append(btn("אישור מנכ״ל",()=>edit("release_approve","אישור גרסה "+r.name,[],base),"primary"));
      card.append(buttons);
    }
    releaseGrid.append(card);
  }
  releaseSection.append(releaseGrid);return releaseSection;
}
function render() {
  const overview=byId("overview"), workspace=byId("workspace");
  const aiOpen=byId("ceoAiPanel")?.open;
  const p=state.products.find(product=>product.id===selected);
  byId("viewTitle").textContent=p?.name || "פרויקטים";
  byId("viewSubtitle").textContent=p?projectStatus(p):"לוח מנכ״ל";
  byId("ceoView").hidden=!p;
  byId("newProduct").hidden=Boolean(p);
  overview.replaceChildren();
  workspace.replaceChildren();
  if(p){
    const nav=make("nav","","project-nav");
    nav.setAttribute("aria-label","ניווט בפרויקט");
    for(const [key,title] of Object.entries(projectTabs)){
      const link=make("a",title,"project-tab");
      link.href="#project/"+encodeURIComponent(p.id)+"/"+key;
      link.onclick=event=>{
        if(event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        navigate(p.id,key);
      };
      if(key===projectTab) link.setAttribute("aria-current","page");
      nav.append(link);
    }
    overview.append(nav);
    if(projectTab==="chats") workspace.append(projectChats(p));
    if(projectTab==="board") workspace.append(...projectBoard(p));
    if(projectTab==="details"){
      const log=management("יומן פעילות");
      for(const event of state.events.filter(e=>e.product===p.id).slice(0,30))
        log.append(make("p",new Date(event.time).toLocaleString("he")+" · "+(actionNames[event.action] || event.action)+" "+event.task));
      workspace.append(projectOverview(p),management("ניהול והגדרות",projectSettings(p),projectManagers(p),
        productRules(p),takeoverPanel(p),agentRuns(p),projectReleases(p),companyStandards(),log));
    }
    return;
  }
  const grid=make("div","","grid home-projects");
  for(const product of state.products){
    const open=product.tasks.filter(t=>t.state!=="done").length;
    const card=btn("",()=>navigate(product.id),"project-tile");
    card.append(make("strong",product.name),make("span",projectStatus(product)+" · "+open+" משימות פתוחות"));
    grid.append(card);
  }
  if(state.products.length) overview.append(grid);
  else overview.append(make("p","פתח פרויקט כדי לראות את המשימות, השיחות ופרטי המוצר במקום אחד.","panel"));
  if(window.AgentHubPages && !state.products.some(p=>p.project_profile?.repo==="https://github.com/guyergas/wordflow")){
    const importRow=make("div","","actions");
    importRow.append(btn("מלא את WordFlow מהריפו",event=>importWordflow(event.currentTarget),"quiet"));
    overview.append(importRow);
  }
  const ceo=state.ceo ?? {};
  const company=management("ניהול החברה",btn("יעדים וקיבולת פיתוח",()=>edit("ceo","יעדי מנכ״ל וקיבולת צוות",[
    area("strategy","יעדים והחלטות עסקיות",ceo.strategy),
    area("customer_voice","משוב ברמת החברה",ceo.customer_voice),
    num("development_slots","מקומות פיתוח פעילים",state.development_portfolio.slots)
  ])));
  if(ceo.strategy) company.append(make("p",ceo.strategy,"detail"));
  if(state.products.length) company.append(sharedDevelopment());
  company.append(companyStandards());
  if(window.AgentHubAI){
    const chat=ceoAI();
    chat.open=Boolean(aiOpen);
    workspace.append(chat);
  }
  workspace.append(company);
}
byId("newProduct").onclick=()=>{if(state) newProject();};
byId("ceoView").onclick=()=>navigate();
window.addEventListener("popstate",readRoute);
window.addEventListener("hashchange",readRoute);
api("/state").then(data=>{state=data;readRoute();}).catch(error=>{byId("status").textContent=error.message;});
setInterval(async()=>{
  if(!state || polling || byId("modal").open || !state.products.some(p=>(p.jobs ?? []).some(j=>j.status==="queued" || j.status==="running"))) return;
  polling=true;
  const before=state;
  try {
    const fresh=await api("/state");
    if(state===before && !byId("modal").open && JSON.stringify(fresh)!==JSON.stringify(before)){state=fresh;render();}
  } catch(error){byId("status").textContent=error.message;}
  finally{polling=false;}
},2200);
let browserRunnerBusy=false;
if(window.AgentHubAI) setInterval(async()=>{
  if(!state || !window.AgentHubAI.connected || browserRunnerBusy) return;
  browserRunnerBusy=true;
  try {
    const {job}=await api("/agent_claim");
    if(!job) return;
    let result;
    try {
      if(job.role==="reviewer"){
        const diff=await window.AgentHubRepository.reviewDiff(job.pr,job.revision,job.repo);
        result=await window.AgentHubAI.reviewCode(job.prompt,diff);
      } else result=await window.AgentHubAI.run(job.prompt);
    }
    catch(error){result={error:error.message};}
    await api("/agent_finish",{id:job.id,product:job.product,started:job.started,...result});
    if(!byId("modal").open){
      const before=state;
      const fresh=await api("/state");
      if(state===before && !byId("modal").open){state=fresh;render();}
    }
  } catch(error){byId("status").textContent=error.message;}
  finally{browserRunnerBusy=false;}
},2400);
</script>
</body></html>
